[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["vendor"]
default-members = ["crates/*", "apps/pdfcraft", "apps/pdfcraft-cli", "xtask"]

[workspace.package]
version = "26.10.22"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/pdfcraft"

[workspace.dependencies]
# Shared frontend components; engines remain independent of egui.
craft-ui = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
# Quit the macOS way (#1136): ⌘Q asks about unsaved changes, and closing quits through `terminate:`.
craft-quit = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "f58bc1a3df490992d633393d0898af0588ce882c" }
# Shared system spooler; document composition remains in pdfcraft-print.
craft-print = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "666c358065261a2816b376fa3bb10538dbf53040" }
# Whether a path stored in a document may be opened (GoToR link targets).
craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "82a24b006eefa036b43c09a67fb9a3fbd17ffe63" }
# internal
pdfcraft-geom = { path = "crates/geom" }
pdfcraft-filters = { path = "crates/filters" }
pdfcraft-cos = { path = "crates/cos" }
pdfcraft-crypt = { path = "crates/crypt" }
pdfcraft-organize = { path = "crates/organize" }
pdfcraft-measure = { path = "crates/measure" }
pdfcraft-annot = { path = "crates/annot" }
pdfcraft-audit = { path = "crates/audit" }
pdfcraft-fonts = { path = "crates/fonts" }
pdfcraft-model = { path = "crates/model" }
pdfcraft-content = { path = "crates/content" }
pdfcraft-redact = { path = "crates/redact" }
pdfcraft-print = { path = "crates/print" }
pdfcraft-xfdf = { path = "crates/xfdf" }
pdfcraft-sign = { path = "crates/sign" }
pdfcraft-optimize = { path = "crates/optimize" }
pdfcraft-a11y = { path = "crates/a11y" }
pdfcraft-oracle = { path = "crates/oracle" }
pdfcraft-testkit = { path = "crates/testkit" }
pdfcraft-ocr = { path = "crates/ocr" }
pdfcraft-js = { path = "crates/js" }
pdfcraft-compare = { path = "crates/compare" }
pdfcraft-preflight = { path = "crates/preflight" }
pdfcraft-export = { path = "crates/export" }
pdfcraft-edit = { path = "crates/edit" }
pdfcraft-create = { path = "crates/create" }
pdfcraft-forms = { path = "crates/forms" }
pdfcraft-xfa = { path = "crates/xfa" }
pdfcraft-render = { path = "crates/render" }
pdfcraft-engine = { path = "crates/engine" }
pdfcraft-platform = { path = "crates/platform" }
pdfcraft-ui-egui = { path = "crates/ui-egui" }
pdfcraft-automation = { path = "crates/automation", default-features = false }

# pdf
hayro = "0.7.1"
hayro-syntax = "0.7.2"
lopdf = "0.45"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
weezl = "0.2"

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
kurbo = "0.13"

# testing
proptest = "1"

# ui
egui = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["svg", "image"] }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# `"*"` matches every non-workspace package: crates.io dependencies and the
# vendored crates under `vendor/` (excluded from the workspace). Our own crates
# keep full debug info. Dependencies keep only line tables, so backtraces still
# show file and line, but debug info for the whole dependency graph stays out of
# every test binary (each UI test binary had a 500-600 MB PDB on Windows, #454).
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.dev]
opt-level = 1

[profile.low-disk]
inherits = "dev"
debug = "line-tables-only"
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1

# Vendored, patched third-party crates (see vendor/README.md). Each patch is meant to go upstream.
[patch.crates-io]
hayro-interpret = { path = "vendor/hayro-interpret" }
hayro = { path = "vendor/hayro" }
hayro-syntax = { path = "vendor/hayro-syntax" }
hayro-jbig2 = { path = "vendor/hayro-jbig2" }
lopdf = { path = "vendor/lopdf" }
winit = { path = "vendor/winit" }
egui-wgpu = { path = "vendor/egui-wgpu" }
vello_common = { path = "vendor/vello_common" }
