name: lhtPDF CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lhtpdf-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 build and tests
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Windows build tools
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $rc = Get-ChildItem $sdk -Filter rc.exe -File -Recurse |
            Where-Object { $_.FullName -match '\\x64\\rc\.exe$' } |
            Select-Object -First 1
          if (-not $rc) { throw "Windows SDK rc.exe not found" }
          Write-Host "Windows resource compiler: $($rc.FullName)"

      - name: Test UI library
        shell: pwsh
        run: cargo test --locked -p pdfcraft-ui-egui --lib

      - name: Build Windows x64 GUI and CLI
        shell: pwsh
        env:
          PDFCRAFT_REQUIRE_WINRES: "1"
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc -p pdfcraft -p pdfcraft-cli
          if ($LASTEXITCODE -ne 0) { throw "Release build failed" }

      - name: Verify build artifacts
        shell: pwsh
        run: |
          $bin = "target/x86_64-pc-windows-msvc/release"
          foreach ($name in @("pdfcraft.exe", "pdfcraft-cli.exe")) {
            $file = Join-Path $bin $name
            if (-not (Test-Path $file)) { throw "Missing executable: $file" }
            $item = Get-Item $file
            Write-Host "$name - $([Math]::Round($item.Length / 1MB, 2)) MB"
          }
